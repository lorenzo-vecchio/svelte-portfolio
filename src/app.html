<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

		<meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />

		<script>
			// Set the theme before first paint to avoid a flash.
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var dark = stored
						? stored === 'dark'
						: window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (error) {
					/* no-op */
				}
			})();
		</script>

		<!-- Umami: privacy-first analytics, no cookies. -->
		<script
			defer
			src="https://analytics.lorenzovecchio.dev/script.js"
			data-website-id="4d7b4076-6569-45de-b0e8-31cbe805d36f"
			data-domains="lorenzovecchio.dev"
		></script>

		%sveltekit.head%
	</head>
	<body id="top" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

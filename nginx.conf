server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # -------------------------
    # SECURITY HEADERS
    # -------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # -------------------------
    # GZIP
    # -------------------------
    gzip on;
    gzip_static on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/ttf
        font/otf
        font/woff
        font/woff2
        image/svg+xml;

    # -------------------------
    # IMMUTABLE BUILD ASSETS
    # -------------------------
    location /_app/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf)$ {
        expires 1y;
        try_files $uri =404;
    }

    # -------------------------
    # IMAGES (STABLE FILENAMES)
    # -------------------------
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        expires 1h;
        try_files $uri =404;
    }

    location = /robots.txt {
        expires 1h;
        try_files $uri =404;
    }

    # -------------------------
    # HTML (ALWAYS REVALIDATE)
    # -------------------------
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # -------------------------
    # STATIC ROUTES
    # Prerendered pages are written as /path.html by adapter-static.
    # -------------------------
    location / {
        expires -1;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}
